# BLinkMaestra (DepEd Teacher Copilot) — Render Blueprint (FREE, no credit card)
# Deploy: connect GitHub repo (betchai/BlinkMaestra) → New → Blueprint
#
# This blueprint uses Render's FREE tier, which requires NO credit card:
#   - Web service: plan `free` (512 MB RAM, spins down after ~15 min idle, ~1 min cold start)
#   - Database: managed PostgreSQL on plan `free`. NOTE: Render free Postgres is a
#     30-day trial — it expires ~30 days after creation and the data is deleted. For
#     durable storage beyond that, either upgrade the DB to a paid plan OR point
#     DATABASE_URL at a free external Postgres (Neon, Supabase) with no expiry.
#
# Free-tier trade-offs to know:
#   - The site sleeps after ~15 min without traffic and takes ~1 min to wake
#     (acceptable for an internal teacher tool; not ideal for a public site).
#   - 750 free instance-hours per month. Heavy use can suspend the service until the
#     next month.
#   - Render free services do NOT support persistent disks, so storage is the free
#     PostgreSQL database above (or an external free Postgres via DATABASE_URL).

services:
  - type: web
    name: blinkmaestra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Point the app at the managed PostgreSQL database created below. The app stores
      # its whole state as a single JSONB row in Postgres whenever DATABASE_URL is set.
      - key: DATABASE_URL
        fromDatabase:
          name: blinkmaestra-db
          property: connectionString
      # Billing: master switch (OFF by default so teachers test free). Flip via the
      # admin Payments panel, or set PAYMENTS_ENABLED=true to require payment.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: FREE_ALLOWANCE
        value: "5"
      - key: BILLING_PER_MONTH
        value: "100"
      # GCash number where teachers send payment — change to your own. This is NOT a
      # payment credential: it's just the number the app displays to teachers. Payment
      # is manual (teacher pays you via GCash, you approve their order in-app).
      - key: BILLING_GCASH
        value: "09299865338"
      # AI provider: set one of these in the Render dashboard (secret) as a bootstrap
      # fallback, OR configure in-app via the admin's "AI provider configuration".
      # Admin-set keys take precedence over these env vars.
      # OpenCode Zen:
      - key: OPENCODE_API_KEY
        sync: false
      # OpenAI / OpenAI-compatible (set OPENAI_API_KEY; optional AI_BASE_URL + AI_MODEL):
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # Any email here is granted the admin role (default bootstrap: betchay.canyas@gmail.com)
      - key: ADMIN_EMAILS
        sync: false
      # SMTP for magic-link / password-reset / billing-approval emails.
      # Gmail (free, personal): SMTP_USER=your Gmail, SMTP_PASS=Google App Password
      # (not your login password), SMTP_FROM=your Gmail. Set these as Render secrets.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: blinkmaestra-db
    plan: free
    databaseName: blinkmaestra
