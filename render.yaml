# BLinkMaestra (DepEd Teacher Copilot) — Render Blueprint
# Deploy: connect GitHub repo (betchai/BlinkMaestra) → New → Blueprint
#
# Single Node web service backed by a managed PostgreSQL database. The workspace
# state is stored as a single JSONB row in Postgres, which is durable and
# backup-able. The legacy persistent-disk JSON path (DATA_DIR) is still supported
# as a fallback when DATABASE_URL is unset.
#
# Estimated cost: Postgres Basic ~$7/mo + web service ~$7/mo on Starter (always on).

databases:
  - name: blinkmaestra-db
    plan: basic-256mb # or: free (arm64) — basic recommended for durability
    databaseName: blinkmaestra

services:
  - type: web
    name: blinkmaestra
    runtime: node
    plan: starter # or: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Point the app at the managed Postgres database created above.
      - key: DATABASE_URL
        fromDatabase:
          name: blinkmaestra-db
          property: connectionString
      # Legacy JSON fallback if DATABASE_URL is removed:
      - key: DATA_DIR
        value: /var/data
      # Billing: master switch (OFF by default so teachers test free). Flip via the
      # admin Payments panel, or set PAYMENTS_ENABLED=true to require payment.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: FREE_ALLOWANCE
        value: "5"
      - key: BILLING_PER_MONTH
        value: "100"
      # GCash number where teachers send payment — change to your own:
      - key: BILLING_GCASH
        value: "09299865338"
      # AI provider: set one of these in the Render dashboard (secret) as a bootstrap
      # fallback, OR configure in-app via the admin's "AI provider configuration".
      # Admin-set keys take precedence over these env vars.
      # OpenCode Zen:
      - key: OPENCODE_API_KEY
        sync: false
      # OpenAI / OpenAI-compatible (set OPENAI_API_KEY; optional AI_BASE_URL + AI_MODEL):
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # Any email here is granted the admin role (default bootstrap: betchay.canyas@gmail.com)
      - key: ADMIN_EMAILS
        sync: false
      # SMTP for magic-link / password-reset emails.
      # Gmail (free, personal): SMTP_USER=your Gmail, SMTP_PASS=Google App Password
      # (not your login password), SMTP_FROM=your Gmail. Set these as Render secrets.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false

    # Legacy persistent disk for the JSON datastore fallback (only used if
    # DATABASE_URL is unset). Can be removed once fully on Postgres.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
