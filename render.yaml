# BLinkMaestra (DepEd Teacher Copilot) — Render Blueprint (FREE, no credit card)
# Deploy: connect GitHub repo (betchai/BlinkMaestra) → New → Blueprint
#
# This blueprint uses Render's FREE tier, which requires NO credit card:
#   - Web service: plan `free` (512 MB RAM, spins down after ~15 min idle, ~1 min cold start)
#   - Storage: a persistent disk holds the JSON datastore (.data/copilot.json). On free
#     tier this is MORE durable than Render's free Postgres, which expires after 30 days
#     and then deletes all data.
#
# Free-tier trade-offs to know:
#   - The site sleeps after 15 min without traffic and takes ~1 min to wake (acceptable
#     for an internal teacher tool; not ideal for a public site).
#   - 750 free instance-hours per month. Heavy use can suspend the service until the
#     next month.
#
# Paid upgrade path (remove the card blocker later, when you're ready):
#   - Web service: starter (~$7/mo, always on, no spin-down).
#   - Storage: add a managed PostgreSQL (basic-256mb ~$7/mo) and set DATABASE_URL to it.
#     Postgres gives durable, backup-able storage and removes the single-instance disk
#     limit. The app transparently uses Postgres whenever DATABASE_URL is set.

services:
  - type: web
    name: blinkmaestra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Storage directory = the persistent disk mounted below. The app stores its
      # whole state here as .data/copilot.json. (Remove this + set DATABASE_URL if
      # you upgrade to a paid managed Postgres.)
      - key: DATA_DIR
        value: /var/data
      # Billing: master switch (OFF by default so teachers test free). Flip via the
      # admin Payments panel, or set PAYMENTS_ENABLED=true to require payment.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: FREE_ALLOWANCE
        value: "5"
      - key: BILLING_PER_MONTH
        value: "100"
      # GCash number where teachers send payment — change to your own. This is NOT a
      # payment credential: it's just the number the app displays to teachers. Payment
      # is manual (teacher pays you via GCash, you approve their order in-app).
      - key: BILLING_GCASH
        value: "09299865338"
      # AI provider: set one of these in the Render dashboard (secret) as a bootstrap
      # fallback, OR configure in-app via the admin's "AI provider configuration".
      # Admin-set keys take precedence over these env vars.
      # OpenCode Zen:
      - key: OPENCODE_API_KEY
        sync: false
      # OpenAI / OpenAI-compatible (set OPENAI_API_KEY; optional AI_BASE_URL + AI_MODEL):
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # Any email here is granted the admin role (default bootstrap: betchay.canyas@gmail.com)
      - key: ADMIN_EMAILS
        sync: false
      # SMTP for magic-link / password-reset / billing-approval emails.
      # Gmail (free, personal): SMTP_USER=your Gmail, SMTP_PASS=Google App Password
      # (not your login password), SMTP_FROM=your Gmail. Set these as Render secrets.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false

    # Persistent disk for the JSON datastore (free tier storage). Persists across
    # restarts and deploys for as long as the service exists.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
