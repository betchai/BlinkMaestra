# BLinkMaestra (DepEd Teacher Copilot) — Render Blueprint
# Deploy: connect GitHub repo (betchai/BlinkMaestra) → New → Blueprint
#
# Single Node web service with a persistent disk for the JSON datastore.
# The JSON DB (DATA_DIR/copilot.json) must survive restarts → persistent disk.
#
# Estimated cost: $0 on free tier (spins down after ~15 min idle)
#                  or ~$7/mo on Starter (always on).

services:
  - type: web
    name: blinkmaestra
    runtime: node
    plan: starter # or: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Point the JSON datastore at the persistent disk mount
      - key: DATA_DIR
        value: /var/data
      # AI provider: set one of these in the Render dashboard (secret) as a bootstrap
      # fallback, OR configure in-app via the admin's "AI provider configuration".
      # Admin-set keys take precedence over these env vars.
      # OpenCode Zen:
      - key: OPENCODE_API_KEY
        sync: false
      # OpenAI / OpenAI-compatible (set OPENAI_API_KEY; optional AI_BASE_URL + AI_MODEL):
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # Any email here is granted the admin role (default bootstrap: betchay.canyas@gmail.com)
      - key: ADMIN_EMAILS
        sync: false
      # SMTP for magic-link / password-reset emails.
      # Gmail (free, personal): SMTP_USER=your Gmail, SMTP_PASS=Google App Password
      # (not your login password), SMTP_FROM=your Gmail. Set these as Render secrets.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false

    # Persistent disk for the JSON datastore (copilot.json)
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
